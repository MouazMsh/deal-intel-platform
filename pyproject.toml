[project]
name = "saudi-deal-intel-platform"
version = "0.1.0"
description = "Saudi Arabia Amazon + Noon Deal Intelligence Telegram Platform"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # Web/async runtime — FastAPI itself is not wired up until Phase 6
    # (admin/API), but httpx is needed now for the Telegram client.
    "httpx>=0.27,<1.0",
    # Config + DTOs
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # Database
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",   # production (Neon Postgres) async driver
    "aiosqlite>=0.20,<1.0", # dev/test SQLite async driver
    # Windows ships no OS-level IANA timezone database, so stdlib zoneinfo
    # cannot resolve "Asia/Riyadh" without this. No-op on Linux/macOS, which
    # already have one at the OS level — safe to install everywhere.
    "tzdata>=2024.1",
    # Fuzzy title matching for canonical product resolution (Phase 2).
    "rapidfuzz>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "black>=24.4,<25.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/providers/*/fixtures.py"]
