name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are referenced anywhere in this workflow. Tests run entirely
# against local SQLite with ENVIRONMENT=test / DRY_RUN=true. Pull requests
# from forks therefore have everything they need to pass CI without any
# repository or environment secret being exposed to them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black (check only)
        run: black --check .

      - name: mypy
        run: mypy app

      - name: pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          DRY_RUN: "true"
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Bandit
        run: bandit -r app -ll

      - name: pip-audit
        run: pip-audit

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
